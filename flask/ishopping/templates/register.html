<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../static/general.css" />
    <link rel="stylesheet" href="../static/register.css" />

    <title>register</title>
  </head>
  <body>
    <div class="container">
      <p class="hero">Please register yourself before making any orders</p>

      <form method="POST" class="form">
        <div>
          <label for="first_name">First Name: </label>
          <input name="first_name" type="text" id="first_name" />
        </div>

        <div>
          <label for="last_name">Last Name: </label>
          <input name="last_name" type="text" id="last_name" />
        </div>

        <div>
          <label for="date_of_birth">Date of Birth: </label>
          <input name="date_of_birth" type="date" id="date_of_birth" />
        </div>

        <div>
          <label for="mobile_number">Mobile Number: </label>
          <input name="register_number" type="number" id="mobile_number" />
        </div>

        <div>
          <label for="email">Email: </label>
          <input name="email" type="text" id="email" />
        </div>

        <div>
          <label for="password">your new password: </label>
          <input name="password" type="text" id="password" />
        </div>

        <button type="submit">Submit</button>
      </form>

      <p class="tertiary_header">
        already registered, then <a href="{{url_for('login')}}">login here</a>
      </p>
    </div>
  </body>
</html>

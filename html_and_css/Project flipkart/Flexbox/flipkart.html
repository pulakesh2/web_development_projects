<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Flipkart</title>
    <link rel="stylesheet" href="style/flipkart.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <img
          src="img/fliplogo.png"
          height="40px"
          width="auto"
          alt="logo"
          class="logo"
        />
        <input
          type="text"
          name="search"
          id="search"
          placeholder="Search for products, brands and more"
        />
        <button class="login">Login</button>
        <button class="btn child1">Become a Seller</button>
        <button class="btn child2">More</button>
        <img
          src="img/cart.webp"
          width="40px"
          height="auto"
          alt=""
          class="cart"
        />
        <button class="btn child3">Cart</button>
      </header>
      <div class="first_layout">
        <figure>
          <img src="img/motorol.webp" alt="mobiles" />
          <figcaption>Mobiles</figcaption>
        </figure>
        <figure>
          <img src="img/women.jpg" alt="womens" />
          <figcaption>Women</figcaption>
        </figure>
        <figure>
          <img src="img/index1.jpg" alt="kids" />
          <figcaption>Kids</figcaption>
        </figure>
        <figure>
          <img src="img/cosmetics.jpg" alt="beauty" />
          <figcaption>Beauty</figcaption>
        </figure>
        <figure>
          <img src="img/furniture.jpg" alt="furniture" class="furniture" />
          <figcaption>Home & Furniture</figcaption>
        </figure>
        <figure>
          <img src="img/lapvert.jpg" alt="laptop" />
          <figcaption>Laptops</figcaption>
        </figure>
        <figure>
          <img src="img/Electronics.jpg" alt="electronics" />
          <figcaption>Electronics</figcaption>
        </figure>
        <figure>
          <img src="img/del.jpg" alt="food" />
          <figcaption>Baby care,Food</figcaption>
        </figure>
        <figure>
          <img src="img/travel.webp" alt="travel" />
          <figcaption>Travel</figcaption>
        </figure>
      </div>

      <div class="second_layout">
        <img src="img/iphone13mini.png" alt="iphone" class="iphone13mini" />
        <aside>
          <h2>Iphone 13 mini</h2>
          <h1>iphone 13 mini with new IOS 16 feature</h1>
          <p>Get 1 Year Hotstar Membership Free</p>
          <p>just 64,999₹</p>
        </aside>
      </div>
      <div class="third_layout">
        <img src="img/skysports.png" alt="skysports" />
        <img src="img/mcdonald.png" alt="mcdonald" />
        <img src="img/playstation.png" alt="playstation" />
        <img src="img/pepsi.png" alt="pepsi" />
        <img src="img/heinecken.png" alt="heinecken" />
        <img src="img/monster.png" alt="monster" />
        <img src="img/redbull.png" alt="redbull" />
      </div>
      <div class="fourth_layout">
        <figure class="bat">
          <img src="img/cricketbat.jpg" alt="cricketbat" />
          <figcaption>
            <h4>Cricket Bat</h4>
            <p>From ₹14,000</p>
          </figcaption>
        </figure>
        <figure>
          <img src="img/backpack.png" alt="backpack" />
          <figcaption>
            <h4>Traveling Bag</h4>
            <p>From ₹3,999</p>
          </figcaption>
        </figure>
        <figure>
          <img src="img/asus.png" alt="asus" />
          <figcaption>
            <h4>Asus Laptop</h4>
            <p>From ₹73,999</p>
          </figcaption>
        </figure>
        <figure>
          <img src="img/guiter.png" alt="guiter" />
          <figcaption>
            <h4>Guiter</h4>
            <p>From ₹5,699</p>
          </figcaption>
        </figure>
        <figure>
          <img src="img/playstation.png" alt="playstation" />
          <figcaption>
            <h4>Play Station 14</h4>
            <p>From ₹84,499</p>
          </figcaption>
        </figure>
        <figure>
          <img src="img/dslr.png" alt="Dslr" />
          <figcaption>
            <h4>Dslr</h4>
            <p>From ₹59,999</p>
          </figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>

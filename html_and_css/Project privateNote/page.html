<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Note</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/navbar.css" />
    <link rel="stylesheet" href="style/general.css" />
    <link rel="stylesheet" href="style/hero-section.css" />
    <link rel="stylesheet" href="style/section-password.css" />
    <link rel="stylesheet" href="style/note-section.css" />
  </head>
  <body>
    <!-- NavBAr -->
    <nav class="section-nav flex">
      <div class="nav-logo">
        <img src="image/logos/private-note.png" alt="" class="logo" />
      </div>
      <ul class="flex">
        <li><a class="nav-link" href="#"> About</a></li>
        <li><a class="nav-link" href="#"> How to use</a></li>
        <li><a href="#" class="nav-link login-btn"> Login</a></li>
      </ul>
    </nav>
    <!-- Hero--Section -->

    <section
      class="section-hero"
      style="
        background-image: linear-gradient(
            rgba(34, 33, 33, 0.6),
            rgba(34, 33, 33, 0.6)
          ),
          url(image/background-image/bg-1.jpg);
      "
    >
      <div class="hero-content container grid grid-cols-2 grid-align-v">
        <div class="content">
          <h1 class="primary-heading">Tame your work, Organize your life</h1>
          <p class="hero-description">
            Remeber everything and tackle any project with your notes,tasks and
            schedule all in one place
          </p>
          <button class="add-notes-btn">Add Notes</button>
        </div>
        <div class="garbage"></div>
      </div>
    </section>

    <!-- SECTION - PASSWORD -->

    <div class="section-password hidden-opacity">
      <form class="flex form-password">
        <div class="user-name grid grid-cols-2">
          <label for="uname" class="user-text">User Name: </label>
          <input
            type="text"
            id="uname"
            name="uname"
            placeholder="Enter your username"
            class="user-input-name"
          />
        </div>
        <div class="password-input grid grid-cols-2">
          <label for="password" class="pass-text">Password: </label>
          <input
            type="password"
            id="pass"
            name="pass"
            placeholder="Enter your password"
            class="user-input-password"
          />
        </div>
        <button class="btn-list-page submit">Open</button>
      </form>
    </div>

    <div class="overlay hidden"></div>

    <!-- Note SECTION -->
    <section class="note hidden hidden-opacity">
      <h1 class="Acount">Hi, Pulakesh</h1>
      <div class="container grid grid-3-cols">
        <!-- List-table -->
        <div class="list">
          <div class="list-heading flex list-cols">
            <!-- <p></p> -->
            <p>User Name</p>
            <p>Time</p>
            <p>Status</p>
          </div>
          <div class="inbox-status"></div>
        </div>

        <!-- reciever-details -->
        <div class="reciever-form">
          <form class="reciever-input-form flex flex-v flex-center">
            <div class="user-name grid grid-1-2-cols">
              <label for="reciever-name" class="reciever-name"
                >User Name:</label
              >
              <input
                type="text"
                id="fname"
                name="reciever-name"
                class="reciever-name-input"
                placeholder="To User Name"
              />
            </div>
            <div class="password grid grid-1-2-cols">
              <label for="receiver-password" class="reciever-password"
                >password:</label
              >
              <input
                type="password"
                id="lname"
                name="reciever-password"
                class="reciever-password-input"
                placeholder="Password"
              />
            </div>
            <button class="submit btn-add">Add</button>
          </form>
        </div>

        <!-- note input -->
        <div class="note-input">
          <textarea
            name=""
            id=""
            cols="30"
            rows="10"
            class="note-text-area"
            placeholder="Write Your Notes"
          ></textarea>
        </div>
      </div>
    </section>

    <!-- login section -->
    <div class="section-login hidden-opacity">
      <form class="flex form-password">
        <div class="user-name grid grid-cols-2">
          <label for="uname" class="user-text">User Name: </label>
          <input
            type="text"
            id="uname"
            name="uname"
            placeholder="Enter your username"
          />
        </div>
        <div class="password-input grid grid-cols-2">
          <label for="password" class="pass-text">Password: </label>
          <input
            type="password"
            id="pass"
            name="pass"
            placeholder="Enter your password"
            \
          />
        </div>
        <button href="messagepage.html" class="btn-login-page submit">
          Log In
        </button>
      </form>
    </div>
  </body>
  <script src="js/popup-password.js"></script>
  <script src="js/data.js"></script>
  <script src="js/popup-login.js"></script>
  <script src="js/note.js"></script>
</html>

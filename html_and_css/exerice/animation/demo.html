<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    body{
        background-color: rgb(154, 248, 4);
    }
    @keyframes animate {
        from{
            width: 400px;
            height: 600px;
        }
        to{
            width: 20px;
            height: 40px;
        }
    }
    img{
        animation: animate .5s ease-in infinite alternate;
    }
    .img{
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>
<body>
    <div class="img">
        <img src="https://picsum.photos/200/300.jpg" width="400px" height="600px" alt="not found">
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: black;
            height: 6vh;
            animation: animate 1s ease-in infinite alternate;
            padding-top: 2px;
        }

        li {
            color: white;
            display: inline-block;
            margin-left: 4vw;
        }

        @keyframes animate {
            from {
                height: 0vw;
                font-size: 16px;
            }

            to {
                height: 3vw;
                font-size: 12px;
            }
        }
        .container{
            display: flex;
            justify-content: center;
            align-content: center;
        }
        @keyframes rotate {
            0%{
               transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        img{
            animation: rotate 1s infinite;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Service</li>
            <li>LogOut</li>
        </ul>
    </nav>
    <div class="container">
        <img src="images.jpg" alt="not found">
    </div>
</body>

</html>

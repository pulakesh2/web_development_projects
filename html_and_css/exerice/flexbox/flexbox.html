<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            background-color: black;
            height: 5vh;
            padding: 0;
            margin: 0;
        }
        li{
            display: inline;
            color: white;
            font-weight: bolder;
            margin-right: 30px;
        }
        .container{
            background-color: rgb(150, 236, 236);
            height: 25vh;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: space-between;
        }
        .box1 {
            background-color: blue;
            height: 20vh;
            width: 15vw;
           
           
        }

        .box2 {
            background-color: red;
            height: 20vh;
            width: 15vw;
            
        }

        .box3 {
            background-color: rgb(158, 221, 12);
            height: 20vh;
            width: 15vw;
           
        }

        .box4 {
            background-color: rgb(241, 4, 135);
            height: 20vh;
            width: 15vw;
           
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>Service</li>
            <li>About</li>
            <li>LogOut</li>
        </ul>
    </nav>
    <div class="container">
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
        <div class="box3">Box3</div>
        <div class="box4">Box4</div>
    </div>

</body>

</html>

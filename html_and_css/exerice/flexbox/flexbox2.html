<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox2</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: black;
            height: 5vh;
            padding: 0;
            margin: 0;
        }
        ul{
            display: flex;
            flex-direction: row-reverse;
            align-content: center;
        }

        li {
            display: inline;
            color: white;
            font-weight: bolder;
            margin-right: 30px;
        }

        .container {
            background-color: rgb(150, 236, 236);
            height: 25vh;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: space-between;
        }

        .box1 {
            background-color: blue;
            height: 20vh;
            width: 25vw;
           
        }

        .box2 {
            background-color: red;
            height: 20vh;
            width: 25vw;
           
        }
        .Box3 {
            background-color: rgb(81, 248, 4);
            height: 20vh;
            width: 25vw;
           
        }
        .image{
            height: 50vh;
            width: 90vw;
            background-image: url("darjeeling.jpg");
            background-repeat: no-repeat;
            position: relative;
            left: 18vw;
        }
        .img{
            background-color: #fff;
           
            
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>Service</li>
            <li>About</li>
            <li>LogOut</li>
        </ul>
    </nav>
    <div class="img">
        <div class="image"></div>
    </div>
  
    <div class="container">
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
        <div class="Box3">Box3</div>
    </div>

</body>

</html>

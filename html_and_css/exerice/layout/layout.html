<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        header{
            background-color: red;
            
        }
        .Content{
            background-color: silver;
            box-sizing: content-box;
            
        }
        footer{
            background-color: blue;
            
        }
        h1{
            text-align: center;
        }
        div{
            margin: 10px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <header>
        <h1>Header</h1>
    </header>
    <div class="Content">
        <h1>Content</h1>
    </div>
    <footer>
        <h1>Footer</h1>
    </footer>
</body>
</html>

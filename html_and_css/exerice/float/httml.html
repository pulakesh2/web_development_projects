<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box1,.box2{
            height: 30vh;
            width: 40vw;
        }
        .box1{
            background-color: red;
            float: left;
            
        }
        .box2{
            background-color: blue;
            float: left;
        }
    </style>
</head>
<body>
    <div class="box1">Box1<h1></h1></div>
    <div class="box2"><h1>Box2</h1></div>
</body>
</html>

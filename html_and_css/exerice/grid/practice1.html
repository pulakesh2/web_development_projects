<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: green;
        }
        nav{
            background-color: rgb(52, 43, 43);
            height: 10vh;
        }
        ul{
           display: flex;
           flex-direction: row-reverse; 
           align-content: center;
           padding-right: 30px;
        }
        li{
            color: aliceblue;
            margin-left: 2vw;
            list-style: none;
            font-size: 30px;
        }
        .container{
            display: grid;
            grid-gap: 4px;
            grid-template-columns: auto auto auto;
            grid-template-rows:12vw 12vw 12vw 12vw ;
        }
        @media  screen and (max-width: 600px) {
            body{
                background-color: yellow;
            }
            li{
                font-size: 20px;
            }
            nav{
                height: 4vh;
            }
        }
        @media  screen and (max-width: 800px){
            body{
                background-color: red;
            }
            li{
                font-size: 20px;
            }
            nav{
                height: 4vh;
            }
        }
    .box1{
       background-color: rgb(245, 3, 3);
       grid-column: 1/3;
    }
    .box2{
        background-color: rgb(3, 100, 246);
    }
    .box3{
        background-color: rgb(117, 244, 6);
    }
    .box4{
        background-color: #01ea7d;
        grid-column: 2/4;
    }
    .box5{
        background-color: rgb(255, 7, 230);
        grid-column: 1/4;
    }
    .box6{
        background-color: rgb(206, 228, 3);
    }
    .box7{
        background-color: rgb(247, 84, 2);
    }
    .box8{
        background-color: rgb(8, 241, 249);
    }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Service</li>
            <li>LogOut</li>
        </ul>
    </nav>
    <div class="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
        <div class="box5">5</div>
        <div class="box6">6</div>
        <div class="box7">7</div>
        <div class="box8">8</div>
    </div>
</body>
</html>
